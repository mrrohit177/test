{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<section class="section"><div class="container" style="max-width:640px">
  <h1>Contact Us</h1>
  <p class="lead">We'd love to hear from farmers, buyers and partners.</p>
  <div class="panel">
    <p>📧 Email: <strong>support@farmconnect.example</strong></p>
    <p>📞 Phone: <strong>+91 00000 00000</strong></p>
    <p>📍 Address: <strong>Maharashtra, India</strong></p>
  </div>
  <div class="panel">
    <h3>Send a message</h3>
    <form method="post" action="/contact">
      {% csrf %}
      <div class="form-group"><label>Name</label><input class="form-control" name="name"></div>
      <div class="form-group"><label>Email</label><input class="form-control" name="email"></div>
      <div class="form-group"><label>Message</label><textarea class="form-control" name="message"></textarea></div>
      <button class="btn btn-primary" type="submit">Send</button>
    </form>
  </div>
</div></section>
{% endblock %}
